name: Pectrium Starter Validation
on:
  pull_request:
    paths:
      - "tooling/**"
      - "templates/**"
      - "docs/PECTRIUM_FOUNDATION_01.md"
      - ".github/workflows/pectrium-starter-validation.yml"
      - "package.json"
  push:
    branches:
      - main
      - docs/pectrium-phase-02-brand-authority
    paths:
      - "tooling/**"
      - "templates/**"
      - ".github/workflows/pectrium-starter-validation.yml"
      - "package.json"
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generator tests
        run: node --test tooling/create-platform.test.mjs
      - name: Studio endpoint smoke tests
        run: node --test tooling/studio-server.test.mjs
      - name: Generate independent project
        run: node tooling/create-platform.mjs --name "Sample Systems" --slug sample-systems --color "#243B53"
      - name: Enable Corepack
        run: corepack enable
      - name: Install generated dependencies
        working-directory: generated/sample-systems
        run: corepack pnpm install --no-frozen-lockfile
      - name: Lint generated project
        working-directory: generated/sample-systems
        run: corepack pnpm lint
      - name: Typecheck generated project
        working-directory: generated/sample-systems
        run: corepack pnpm typecheck
      - name: Build generated project
        working-directory: generated/sample-systems
        run: corepack pnpm build
